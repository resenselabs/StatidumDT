<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 905" width="780" height="905" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b5b5b5" stroke-width="1.6"/></pattern>
    <style>
      .band{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
      .bandT{font-size:11.5px;font-weight:700;letter-spacing:0.6px;fill:#111}
      .bandS{font-size:10px;fill:#555;font-style:italic}
      .box{fill:#fff;stroke:#333;stroke-width:1.2}
      .boxA{fill:#e3e3e3;stroke:#222;stroke-width:1.2}
      .prop{fill:#fff;stroke:#666;stroke-width:1.1;stroke-dasharray:4 3}
      .t{font-size:11px;fill:#111}
      .tb{font-size:11px;font-weight:700;fill:#111}
      .ts{font-size:9.8px;fill:#333}
      .ti{font-size:9.8px;fill:#444;font-style:italic}
      .ln{stroke:#222;stroke-width:1.3;fill:none}
      .lnd{stroke:#555;stroke-width:1.2;fill:none;stroke-dasharray:5 3}
      .lab{font-size:9.5px;fill:#222}
    </style>
  </defs>
  <rect x="0" y="0" width="780" height="905" fill="#ffffff"/>

  <!-- ============ LAYER 1 ============ -->
  <rect class="band" x="10" y="8" width="722" height="150" rx="6"/>
  <rect class="box" x="20" y="34" width="702" height="26" rx="3"/>
  <text class="t" x="371" y="51" text-anchor="middle">Pilot west concourse: zones CONC-W-010…019 · gates A–D · portals · stairs · elevator · ramp · concessions · restrooms · first aid</text>
  <g>
    <rect class="box" x="20" y="72" width="168" height="76" rx="3"/>
    <text class="tb" x="104" y="89" text-anchor="middle">CCTV camera nodes (8)</text>
    <text class="ts" x="104" y="106" text-anchor="middle">cover 10 zones + Gate B queue</text>
    <text class="ti" x="104" y="124" text-anchor="middle">limitation: occlusion causes</text>
    <text class="ti" x="104" y="137" text-anchor="middle">density-dependent undercount</text>
  </g>
  <g>
    <rect class="box" x="198" y="72" width="168" height="76" rx="3"/>
    <text class="tb" x="282" y="89" text-anchor="middle">WiFi access points (5)</text>
    <text class="ts" x="282" y="106" text-anchor="middle">associated devices per area</text>
    <text class="ti" x="282" y="124" text-anchor="middle">limitation: devices ≠ people;</text>
    <text class="ti" x="282" y="137" text-anchor="middle">ratio drifts; up to 30 s lag</text>
  </g>
  <g>
    <rect class="box" x="376" y="72" width="168" height="76" rx="3"/>
    <text class="tb" x="460" y="89" text-anchor="middle">Turnstile controllers (4)</text>
    <text class="ts" x="460" y="106" text-anchor="middle">entries per gate, gate status</text>
    <text class="ti" x="460" y="124" text-anchor="middle">limitation: observes the gates</text>
    <text class="ti" x="460" y="137" text-anchor="middle">only, not the concourse</text>
  </g>
  <g>
    <rect class="box" x="554" y="72" width="168" height="76" rx="3"/>
    <text class="tb" x="638" y="89" text-anchor="middle">Context feeds</text>
    <text class="ts" x="638" y="106" text-anchor="middle">stair / elevator / ramp status,</text>
    <text class="ts" x="638" y="120" text-anchor="middle">incidents, weather, game phase</text>
  </g>

  <!-- arrows L1 -> L2 -->
  <line class="ln" x1="104" y1="148" x2="104" y2="196" marker-end="url(#ah)"/>
  <line class="ln" x1="282" y1="148" x2="282" y2="196" marker-end="url(#ah)"/>
  <line class="ln" x1="460" y1="148" x2="460" y2="196" marker-end="url(#ah)"/>

  <!-- ============ LAYER 2 ============ -->
  <rect class="band" x="10" y="168" width="722" height="138" rx="6"/>
  <g>
    <rect class="box" x="20" y="197" width="168" height="66" rx="3"/>
    <text class="tb" x="104" y="213" text-anchor="middle">Edge video analytics</text>
    <text class="ts" x="104" y="229" text-anchor="middle">per-zone count, in/out flow,</text>
    <text class="ts" x="104" y="242" text-anchor="middle">mean speed, direction, queue</text>
    <text class="ts" x="104" y="255" text-anchor="middle">length · 1 Hz</text>
  </g>
  <g>
    <rect class="box" x="198" y="197" width="168" height="66" rx="3"/>
    <text class="tb" x="282" y="213" text-anchor="middle">Access-point aggregation</text>
    <text class="ts" x="282" y="229" text-anchor="middle">associated-device count</text>
    <text class="ts" x="282" y="242" text-anchor="middle">per 30 s window · 1/30 Hz</text>
  </g>
  <g>
    <rect class="box" x="376" y="197" width="168" height="66" rx="3"/>
    <text class="tb" x="460" y="213" text-anchor="middle">Gate controller output</text>
    <text class="ts" x="460" y="229" text-anchor="middle">entries in last 60 s,</text>
    <text class="ts" x="460" y="242" text-anchor="middle">lanes open, status · 1 Hz</text>
  </g>
  <g>
    <rect x="554" y="197" width="168" height="62" rx="3" fill="url(#hatch)" stroke="#333" stroke-width="1.2"/>
    <rect x="560" y="201" width="156" height="54" rx="2" fill="#ffffff" fill-opacity="0.88"/>
    <text class="tb" x="638" y="214" text-anchor="middle">Kept at edge / not collected</text>
    <text class="ts" x="638" y="228" text-anchor="middle">video frames, face crops,</text>
    <text class="ts" x="638" y="240" text-anchor="middle">long-lived track IDs, MAC</text>
    <text class="ts" x="638" y="251" text-anchor="middle">addresses, ticket identities</text>
  </g>
  <rect class="prop" x="554" y="264" width="168" height="38" rx="3"/>
  <text class="ti" x="638" y="279" text-anchor="middle" style="font-size:9px">PROPOSED: small-count suppression</text>
  <text class="ti" x="638" y="292" text-anchor="middle" style="font-size:9px">or Laplace noise before release</text>

  <!-- ============ AGGREGATE-ONLY BOUNDARY ============ -->
  <line x1="4" y1="320" x2="770" y2="320" stroke="#000" stroke-width="3.2" stroke-dasharray="12 6"/>
  <rect x="96" y="309" width="550" height="22" fill="#ffffff" stroke="#000" stroke-width="1.4" rx="3"/>
  <text x="371" y="324" text-anchor="middle" font-size="11px" font-weight="700" fill="#000">AGGREGATE-ONLY INFORMATION BOUNDARY · only Table 2 messages cross (≈ 2.1 kB/s)</text>

  <!-- arrows crossing boundary -->
  <line class="ln" x1="104" y1="263" x2="104" y2="303" />
  <line class="ln" x1="282" y1="263" x2="282" y2="303" />
  <line class="ln" x1="460" y1="263" x2="460" y2="303" />
  <path class="ln" d="M638 148 L638 160 L748 160 L748 336 L740 336" />
  <line class="ln" x1="104" y1="331" x2="104" y2="365" marker-end="url(#ah)"/>
  <line class="ln" x1="282" y1="331" x2="282" y2="352" />
  <line class="ln" x1="460" y1="331" x2="460" y2="352" />
  <path class="ln" d="M282 352 L180 352 L180 365" marker-end="url(#ah)"/>
  <path class="ln" d="M460 352 L210 352" />
  <path class="ln" d="M740 336 L740 352 L460 352"/>
  <text class="lab" x="752" y="250" transform="rotate(90 752 250)" text-anchor="middle">context (aggregate)</text>

  <!-- ============ LAYER 3 ============ -->
  <rect class="band" x="10" y="338" width="722" height="186" rx="6"/>
  <g>
    <rect class="box" x="20" y="365" width="200" height="64" rx="3"/>
    <text class="tb" x="120" y="381" text-anchor="middle">(1) Ingestion and normalisation</text>
    <text class="ts" x="120" y="397" text-anchor="middle">common clock, zone association,</text>
    <text class="ts" x="120" y="410" text-anchor="middle">SI units, per-source variance</text>
    <text class="ts" x="120" y="422" text-anchor="middle">model σᶜⱼ, σʷⱼ</text>
  </g>
  <line class="ln" x1="220" y1="397" x2="258" y2="397" marker-end="url(#ah)"/>
  <g>
    <rect class="box" x="260" y="365" width="210" height="64" rx="3"/>
    <text class="tb" x="365" y="381" text-anchor="middle">(2) Per-zone fusion · 1 Hz ◆</text>
    <text class="ts" x="365" y="397" text-anchor="middle">inverse-variance update with a</text>
    <text class="ts" x="365" y="410" text-anchor="middle">process-model prior (Eqs. 8–9,</text>
    <text class="ts" x="365" y="422" text-anchor="middle">Algorithm 1)</text>
  </g>
  <line class="ln" x1="470" y1="397" x2="508" y2="397" marker-end="url(#ah)"/>
  <g>
    <rect class="boxA" x="510" y="365" width="212" height="64" rx="3"/>
    <text class="tb" x="616" y="381" text-anchor="middle">(3) Fused crowd state</text>
    <text class="ts" x="616" y="397" text-anchor="middle">N̂ⱼ, k̂ⱼ, v̂ⱼ, flows, direction,</text>
    <text class="ts" x="616" y="410" text-anchor="middle">uncertainty σ̂ⱼ, confidence cⱼ,</text>
    <text class="ts" x="616" y="422" text-anchor="middle">gate and amenity queues</text>
  </g>
  <!-- shared model -->
  <rect x="150" y="448" width="400" height="66" rx="4" fill="#ffffff" stroke="#000" stroke-width="2.6"/>
  <rect x="155" y="453" width="390" height="56" rx="3" fill="none" stroke="#000" stroke-width="0.8"/>
  <text class="tb" x="350" y="469" text-anchor="middle">◆ SHARED ZONE-FLOW PROCESS MODEL (Eqs. 1–7)</text>
  <text class="ts" x="350" y="485" text-anchor="middle">attachment-to-attachment streams · Little's-law loading · speed–density v(k)</text>
  <text class="ts" x="350" y="499" text-anchor="middle">capacity-limited backlogs · gate and amenity queues · logit destination choice</text>
  <path class="ln" d="M330 448 L330 431" marker-end="url(#ah)"/>
  <text class="lab" x="335" y="442">prior ΔNⱼ (Eq. 8)</text>
  <rect class="prop" x="566" y="448" width="156" height="66" rx="3"/>
  <text class="ti" x="644" y="466" text-anchor="middle">PROPOSED: per-source</text>
  <text class="ti" x="644" y="479" text-anchor="middle">innovation monitoring for</text>
  <text class="ti" x="644" y="492" text-anchor="middle">biased or compromised</text>
  <text class="ti" x="644" y="505" text-anchor="middle">sources (not implemented)</text>

  <!-- state bus to layer 4 -->
  <path class="ln" d="M616 429 L616 440 L740 440 L740 545 L104 545"/>
  <line class="ln" x1="104" y1="545" x2="104" y2="572" marker-end="url(#ah)"/>
  <line class="ln" x1="282" y1="545" x2="282" y2="572" marker-end="url(#ah)"/>
  <line class="ln" x1="460" y1="545" x2="460" y2="572" marker-end="url(#ah)"/>
  <line class="ln" x1="638" y1="545" x2="638" y2="572" marker-end="url(#ah)"/>
  <text class="lab" x="600" y="541">fused state</text>
  <!-- model reuse links -->
  <path class="lnd" d="M250 514 L250 530 L282 530 L282 572"/>
  <path class="lnd" d="M450 514 L450 530 L460 530 L460 572"/>
  <text class="lab" x="300" y="527">model reuse (◆)</text>

  <!-- ============ LAYER 4 ============ -->
  <rect class="band" x="10" y="552" width="722" height="196" rx="6"/>
  <g>
    <rect class="box" x="20" y="574" width="168" height="76" rx="3"/>
    <text class="tb" x="104" y="590" text-anchor="middle">(4a) Anomaly rules</text>
    <text class="ts" x="104" y="606" text-anchor="middle">every 2 s on estimated state;</text>
    <text class="ts" x="104" y="619" text-anchor="middle">onset persistence P = 6 s,</text>
    <text class="ts" x="104" y="632" text-anchor="middle">20 s clearing hold (Table 4)</text>
  </g>
  <g>
    <rect class="box" x="198" y="574" width="168" height="76" rx="3"/>
    <text class="tb" x="282" y="590" text-anchor="middle">(5a) Scenario engine ◆</text>
    <text class="ts" x="282" y="606" text-anchor="middle">baseline and intervention arms</text>
    <text class="ts" x="282" y="619" text-anchor="middle">in lockstep (3 s, ≤ 2700 s);</text>
    <text class="ts" x="282" y="632" text-anchor="middle">clearance, peak density</text>
  </g>
  <g>
    <rect class="box" x="376" y="574" width="168" height="76" rx="3"/>
    <text class="tb" x="460" y="590" text-anchor="middle">(4b) Forecaster ◆</text>
    <text class="ts" x="460" y="606" text-anchor="middle">300 s roll-out every 5 s;</text>
    <text class="ts" x="460" y="619" text-anchor="middle">k at +2 / +5 min, threshold ETA;</text>
    <text class="ts" x="460" y="632" text-anchor="middle">state insertion, rate correction</text>
  </g>
  <g>
    <rect class="box" x="554" y="574" width="168" height="76" rx="3"/>
    <text class="tb" x="638" y="590" text-anchor="middle">(5b) Crowd-aware router ◆</text>
    <text class="ts" x="638" y="606" text-anchor="middle">generalised-cost Dijkstra</text>
    <text class="ts" x="638" y="619" text-anchor="middle">(Eq. 11, Algorithm 3); spectator,</text>
    <text class="ts" x="638" y="632" text-anchor="middle">accessible, responder routes</text>
  </g>
  <line class="ln" x1="544" y1="612" x2="552" y2="612" marker-end="url(#ah)"/>
  <text class="lab" x="549" y="666" text-anchor="middle"></text>
  <path class="ln" d="M520 650 L520 668 L590 668 L590 652" marker-end="url(#ah)"/>
  <text class="lab" x="515" y="664" text-anchor="end">+2 min forecast k̂⁽⁺²⁾ →</text>
  <!-- feedback loop -->
  <rect class="boxA" x="600" y="676" width="122" height="52" rx="3"/>
  <text class="tb" x="661" y="691" text-anchor="middle">Recommendation</text>
  <text class="tb" x="661" y="704" text-anchor="middle">load Lⱼ, Rₘ</text>
  <text class="ts" x="661" y="718" text-anchor="middle">decay τ = 180 s</text>
  <path class="ln" d="M700 650 L700 674" marker-end="url(#ah)"/>
  <path class="ln" d="M624 676 L624 652" marker-end="url(#ah)"/>
  <text class="lab" x="704" y="666">issued</text>
  <text class="lab" x="596" y="722" text-anchor="end">load feedback</text><text class="lab" x="596" y="734" text-anchor="end">(herding control)</text>

  <!-- bus to layer 5 -->
  <path class="ln" d="M104 650 L104 772"  marker-end="url(#ah)"/>
  <path class="ln" d="M282 650 L282 772"  marker-end="url(#ah)"/>
  <path class="ln" d="M400 650 L400 772"  marker-end="url(#ah)"/>
  <path class="ln" d="M661 728 L661 772"  marker-end="url(#ah)"/>
  

  <!-- ============ LAYER 5 ============ -->
  <rect class="band" x="10" y="756" width="722" height="140" rx="6"/>
  <g font-size="10px">
    <rect class="box" x="20" y="776" width="134" height="58" rx="3"/>
    <text class="tb" x="87" y="792" text-anchor="middle">MIRROR</text>
    <text class="ts" x="87" y="807" text-anchor="middle">estimated current</text>
    <text class="ts" x="87" y="820" text-anchor="middle">state and alerts</text>
    <rect class="box" x="161" y="776" width="134" height="58" rx="3"/>
    <text class="tb" x="228" y="792" text-anchor="middle">PREDICT</text>
    <text class="ts" x="228" y="807" text-anchor="middle">+2 / +5 min density,</text>
    <text class="ts" x="228" y="820" text-anchor="middle">bottleneck ETA</text>
    <rect class="box" x="302" y="776" width="134" height="58" rx="3"/>
    <text class="tb" x="369" y="792" text-anchor="middle">SIMULATE</text>
    <text class="ts" x="369" y="807" text-anchor="middle">baseline vs</text>
    <text class="ts" x="369" y="820" text-anchor="middle">intervention</text>
    <rect class="box" x="443" y="776" width="134" height="58" rx="3"/>
    <text class="tb" x="510" y="792" text-anchor="middle">NAVIGATE</text>
    <text class="ts" x="510" y="807" text-anchor="middle">shortest vs</text>
    <text class="ts" x="510" y="820" text-anchor="middle">crowd-aware routes</text>
    <rect class="box" x="584" y="776" width="138" height="58" rx="3"/>
    <text class="tb" x="653" y="792" text-anchor="middle">REPLAY</text>
    <text class="ts" x="653" y="807" text-anchor="middle">state frames every 2 s,</text>
    <text class="ts" x="653" y="820" text-anchor="middle">event timeline</text>
  </g>
  <rect class="boxA" x="20" y="842" width="702" height="46" rx="3"/>
  <text class="tb" x="371" y="859" text-anchor="middle">Audit log and human oversight</text>
  <text class="ts" x="371" y="875" text-anchor="middle">time-stamped alerts, predictions, simulations, routing changes and operator actions · all outputs advisory and labelled as simulated</text>

  <!-- human-in-the-loop return path -->
  <path class="lnd" d="M722 865 L764 865 L764 12 L740 12" />
  <path class="lnd" d="M764 12 L760 12"/>
  <line x1="764" y1="40" x2="734" y2="40" class="lnd" marker-end="url(#ahg)"/>
  <text class="lab" x="772" y="470" transform="rotate(90 772 470)" text-anchor="middle">operator decision → staff action (deployment only; acts on the simulated venue in the testbed)</text>

  <rect x="15" y="13" width="331" height="16" rx="3" fill="#f4f4f4"/><text class="bandT" x="20" y="25">LAYER 1 · PHYSICAL ENVIRONMENT AND SENSING</text>
  <rect x="15" y="173" width="308" height="16" rx="3" fill="#f4f4f4"/><text class="bandT" x="20" y="185">LAYER 2 · PRIVACY-AWARE EDGE PROCESSING</text>
  <rect x="15" y="343" width="217" height="16" rx="3" fill="#f4f4f4"/><text class="bandT" x="20" y="355" >LAYER 3 · DIGITAL TWIN CORE</text>
  <rect x="15" y="555" width="323" height="16" rx="3" fill="#f4f4f4"/><text class="bandT" x="20" y="567">LAYER 4 · PREDICTION AND DECISION SUPPORT</text>
  <rect x="15" y="759" width="300" height="16" rx="3" fill="#f4f4f4"/><text class="bandT" x="20" y="771" >LAYER 5 · OPERATOR INTERFACE AND AUDIT</text>
  <text class="bandS" x="726" y="25" text-anchor="end">emulated by synthetic venue and sensor-error models in the reference implementation</text>
</svg>
